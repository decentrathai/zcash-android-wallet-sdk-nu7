# cargo-about configuration for the third-party licence list of backend-lib (nu7-zchat/THIRD-PARTY-LICENSES.md).
# The accepted licences are backend-lib/deny.toml's allow list (cargo deny check licenses enforces it).
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
